  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(to bottom, #000000, #000000);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: clamp(28px, 7vw, 56px) 16px 24px;
    }

    .container {
      width: min(100%, 600px);
      max-width: 600px;
      text-align: center;
      margin-top: 0;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      text-align: left;
    }

    .logo {
      width: clamp(120px, 28vw, 150px);
      height: auto;
      flex-shrink: 0;
    }
    
    /* Divider */
    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.18);
      margin-bottom: clamp(32px, 8vw, 50px);
      align-self: center;
    }

    .brand-text {
      flex: 1;
      font-size: clamp(13px, 2.4vw, 14px);
      line-height: 1.6;
      opacity: 0.9;
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      text-align: right;
    }

    h1 {
      font-size: clamp(24px, 6vw, 30px);
      margin: 10px 0 10px;
      line-height: 1.15;
    }

  
    p {
      font-size: clamp(14px, 3.2vw, 16px);
      line-height: 1.5;
      opacity: 0.8;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: clamp(16px, 4vw, 20px);
      margin-bottom: 15px;
      transition: 0.3s ease;
      border: 1px solid rgba(255,255,255,0.1);
      overflow-wrap: anywhere;
    }

    .card:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-4px);
    }

    .card a {
      text-decoration: none;
      color: #ffffff;
      font-weight: bold;
      font-size: clamp(15px, 3.6vw, 17px);
      line-height: 1.3;
      display: block;
    }

    a.card {
      text-decoration: none;
      color: inherit;
    }

    .card span {
      display: block;
      font-size: 13px;
      font-weight: normal;
      opacity: 0.7;
      margin-top: 6px;
      line-height: 1.4;
    }

    @media (max-width: 520px) {
      .header-row {
        justify-content: center;
        gap: 12px;
      }

      .brand-text {
        max-width: 190px;
      }
    }

    @media (max-width: 380px) {
      body {
        padding-inline: 12px;
      }

      .header-row {
        flex-direction: column;
        text-align: center;
      }

      .brand-text {
        max-width: none;
        text-align: center;
      }
    }

  </style>
</head>
